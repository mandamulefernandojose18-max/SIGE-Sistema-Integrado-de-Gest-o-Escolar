name: SIGE — Deploy Automático na VM

on:
  push:
    branches:
      - main
      - "chore/**"
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch para realizar o deploy'
        required: true
        default: 'main'

concurrency:
  group: deploy-vm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Etapa 1: Validação de Qualidade & Testes de Backend e Frontend
  # -------------------------------------------------------------
  verify-and-test:
    name: Testar Backend & Frontend antes do Deploy
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sige_user
          POSTGRES_PASSWORD: sige_secure_pass_2026
          POSTGRES_DB: sige_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # Backend Django Verification
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libjpeg-dev zlib1g-dev libfreetype6-dev

      - name: Instalar Dependências Python
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django System Check
        working-directory: ./backend
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test_secret_ci_key_sige_2026

      - name: Executar Migrações de Teste
        working-directory: ./backend
        run: python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test_secret_ci_key_sige_2026

      - name: Executar Suite de Testes (Pytest)
        working-directory: ./backend
        run: pytest -v
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test_secret_ci_key_sige_2026

      # Frontend Integrity Verification
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Checar Sintaxe do Frontend
        working-directory: ./frontend
        run: |
          node -c server.js
          node -c js/config.js
          node -c js/app.js

  # -------------------------------------------------------------
  # Etapa 2: Deploy Automático via SSH na VM
  # -------------------------------------------------------------
  deploy-to-vm:
    name: Conectar via SSH e Executar Deploy na VM
    needs: verify-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Validar Segredos da VM
        run: |
          if [ -z "${{ secrets.VM_HOST }}" ]; then
            echo "::warning title=Secrets da VM Ausentes::O segredo VM_HOST não foi configurado. Configure VM_HOST, VM_USER e VM_SSH_KEY no GitHub Secrets para que o deploy na VM seja executado automaticamente."
          fi

      - name: Executar Deploy Remoto na VM via SSH
        if: secrets.VM_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          passphrase: ${{ secrets.VM_PASSPHRASE || '' }}
          envs: GITHUB_SHA,GITHUB_REF_NAME
          script_stop: true
          command_timeout: 15m
          script: |
            TARGET_BRANCH="${{ inputs.branch || github.ref_name }}"
            DEPLOY_DIR="${{ secrets.VM_DEPLOY_PATH || '/var/www/sige' }}"

            echo "========================================================"
            echo "Conexão SSH estabelecida com a VM com sucesso!"
            echo "Diretório de Deploy: ${DEPLOY_DIR}"
            echo "Branch de Atualização: ${TARGET_BRANCH}"
            echo "========================================================"

            if [ ! -d "${DEPLOY_DIR}" ]; then
              echo "[ERRO] Diretório ${DEPLOY_DIR} não existe na VM."
              echo "Certifique-se de clonar o repositório inicialmente na VM."
              exit 1
            fi

            cd "${DEPLOY_DIR}"
            chmod +x scripts/deploy-vm.sh
            PROJECT_DIR="${DEPLOY_DIR}" bash scripts/deploy-vm.sh "${TARGET_BRANCH}"

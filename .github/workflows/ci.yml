name: SIGE CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "chore/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend Test, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sige_user
          POSTGRES_PASSWORD: sige_secure_pass_2026
          POSTGRES_DB: sige_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Instalar Dependências do Backend
        run: npm install

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Checagem de Tipos TypeScript (Typecheck)
        run: npx tsc --noEmit

      - name: Executar Testes Automatizados (Jest)
        run: npm test
        env:
          DATABASE_URL: "file:./test.db"
          JWT_SECRET: "test_secret_ci_key"
          JWT_REFRESH_SECRET: "test_refresh_ci_key"

      - name: Compilar Projeto Backend (Build)
        run: npm run build

  frontend-ci:
    name: Frontend Syntax & Integrity Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Checar Sintaxe do Código JavaScript do Frontend
        run: |
          node -c server.js
          node -c js/config.js
          node -c js/app.js

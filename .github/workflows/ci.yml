name: SIGE CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop", "chore/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Django REST Framework Test, Check & Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sige_user
          POSTGRES_PASSWORD: sige_secure_pass_2026
          POSTGRES_DB: sige_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar Dependências do Sistema (ReportLab / Pillow / LibPQ)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev libjpeg-dev zlib1g-dev libfreetype6-dev

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Checagem de Sistema Django
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test_secret_ci_key_sige_2026

      - name: Executar Migrações do Banco de Dados
        run: python manage.py migrate
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test_secret_ci_key_sige_2026

      - name: Executar Suite de Testes com Pytest
        run: pytest -v
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: test_secret_ci_key_sige_2026

  frontend-ci:
    name: Frontend Syntax & Integrity Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Checar Sintaxe do Código JavaScript do Frontend
        run: |
          node -c server.js
          node -c js/config.js
          node -c js/app.js

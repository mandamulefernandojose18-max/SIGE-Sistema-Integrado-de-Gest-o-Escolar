components:
  schemas:
    MaterialEscolar:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        escola_id:
          type: string
          format: uuid
          readOnly: true
        escola_nome:
          type: string
          readOnly: true
        titulo:
          type: string
          maxLength: 255
        descricao:
          type: string
          nullable: true
        classe:
          type: string
          maxLength: 50
        disciplina:
          type: string
          format: uuid
          nullable: true
        disciplina_id:
          type: string
          format: uuid
          nullable: true
        disciplina_nome:
          type: string
          readOnly: true
          nullable: true
        tipo:
          $ref: '#/components/schemas/TipoEnum'
        nome_arquivo:
          type: string
          maxLength: 255
        extensao:
          type: string
          maxLength: 20
        tamanho_bytes:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        tipo_mime:
          type: string
          maxLength: 100
        conteudo_base64:
          type: string
          writeOnly: true
          nullable: true
        arquivo_url:
          type: string
          format: uri
          nullable: true
          maxLength: 200
        publicado_por:
          type: string
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - classe
      - created_at
      - disciplina_nome
      - escola_id
      - escola_nome
      - id
      - titulo
      - updated_at
    PaginatedMaterialEscolarList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/MaterialEscolar'
    TipoEnum:
      enum:
      - MANUAL
      - FICHA
      - LIVRO
      - EXERCICIOS
      - GUIA
      - APOSTILA
      - OUTRO
      type: string
      description: '* `MANUAL` - Manual Escolar

        * `FICHA` - Ficha de Exercícios

        * `LIVRO` - Livro Didático

        * `EXERCICIOS` - Caderno de Exercícios

        * `GUIA` - Guia do Professor

        * `APOSTILA` - Apostila / Resumo

        * `OUTRO` - Outro Recurso'
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

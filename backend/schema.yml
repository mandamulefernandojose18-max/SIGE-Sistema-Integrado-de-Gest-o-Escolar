components:
  schemas:
    AlocacaoDocente:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        professor:
          type: string
          format: uuid
        professor_nome:
          type: string
          readOnly: true
        disciplina:
          type: string
          format: uuid
        disciplina_nome:
          type: string
          readOnly: true
        disciplina_codigo:
          type: string
          readOnly: true
        turma:
          type: string
          format: uuid
        turma_nome:
          type: string
          readOnly: true
        turma_grau:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - disciplina
      - disciplina_codigo
      - disciplina_nome
      - id
      - professor
      - professor_nome
      - turma
      - turma_grau
      - turma_nome
    Aluno:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        matricula:
          type: string
          maxLength: 50
        nome:
          type: string
          maxLength: 255
        apelido:
          type: string
          nullable: true
          maxLength: 100
        turma:
          type: string
          format: uuid
          nullable: true
        turma_nome:
          type: string
          readOnly: true
          nullable: true
        turma_grau:
          type: string
          readOnly: true
          nullable: true
        data_nascimento:
          type: string
          format: date
        genero:
          type: string
          maxLength: 10
        tipo_documento:
          type: string
          maxLength: 100
        numero_documento:
          type: string
          nullable: true
          maxLength: 100
        nuit:
          type: string
          nullable: true
          maxLength: 50
        nacionalidade:
          type: string
          maxLength: 100
        provincia:
          type: string
          maxLength: 100
        distrito:
          type: string
          maxLength: 100
        pai:
          type: string
          nullable: true
          maxLength: 255
        mae:
          type: string
          nullable: true
          maxLength: 255
        nome_responsavel:
          type: string
          nullable: true
          maxLength: 255
        contato_responsavel:
          type: string
          nullable: true
          maxLength: 50
        email_responsavel:
          type: string
          format: email
          nullable: true
          maxLength: 254
        status:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - data_nascimento
      - genero
      - id
      - matricula
      - nome
      - turma_grau
      - turma_nome
      - updated_at
    Certificado:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        aluno_nome:
          type: string
          readOnly: true
        aluno_matricula:
          type: string
          readOnly: true
        escola_nome:
          type: string
          readOnly: true
        tipo:

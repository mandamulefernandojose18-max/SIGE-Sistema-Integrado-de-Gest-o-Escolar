name: Auto Update Backend Documentation

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'apps/**'
      - 'config/**'
      - 'common/**'
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Instalar Dependências
        run: |
          sudo apt-get update && sudo apt-get install -y libpq-dev
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Gerar Documentação e Schemas OpenAPI
        run: python scripts/update_docs.py

      - name: Commit e Push das Atualizações de Documentação
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ schema.yml
          if ! git diff --staged --quiet; then
            git commit -m "docs: auto-update API and models documentation [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Nenhuma alteração na documentação detectada."
          fi

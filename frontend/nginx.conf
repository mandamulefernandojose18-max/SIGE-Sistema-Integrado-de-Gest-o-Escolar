# ==============================================================================
# SIGE — NGINX (Ocultação Rigorosa de IP e Forçamento do Domínio Oficial HTTPS)
# ==============================================================================

# ------------------------------------------------------------------------------
# Protecção anti-DDoS / abuso (camada Nginx, antes de chegar ao Django)
# ------------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=sige_geral:10m rate=30r/s;
limit_req_zone  $binary_remote_addr zone=sige_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=sige_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=sige_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# 1. Servidor HTTP (Porta 80): Redireciona tudo para HTTPS no domínio oficial sigesaas.duckdns.org
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Desafios ACME Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # Health check local interno para o Docker
    location = /health/ {
        proxy_pass http://backend:8000/health/;
        proxy_set_header Host localhost;
    }

    # Redirecionamento SEMPRE para o domínio oficial fixo (nunca $host: evita Host-header / open redirect e não expõe IP)
    location / {
        return 301 https://sigesaas.duckdns.org$request_uri;
    }
}

# 2. Servidor HTTPS (Porta 443 — SSL/TLS Oficial Let's Encrypt)
server {
    listen 443 ssl default_server;
    http2 on;
    server_name sigesaas.duckdns.org _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    # Anti-slowloris e anti-abuso de ligações
    server_tokens off;
    client_header_timeout 15s;
    client_body_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 30s;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    limit_conn sige_conn 60;
    limit_req zone=sige_geral burst=80 nodelay;

    # Nunca servir ficheiros ocultos (.git, .env, .htaccess, ...), excepto o desafio ACME
    location ~ /\.(?!well-known) {
        return 404;
    }

    # --- "Trancar" ficheiros sensíveis (equivalente Nginx do .htaccess; o .htaccess só vale em Apache) ---
    # Código-fonte, configuração, segredos, cópias de segurança, dumps e mapas de código nunca saem para a Internet.
    location ~* \.(?:map|md|py|pyc|pyo|sql|sqlite3?|db|log|bak|old|orig|save|swp|swo|tmp|ini|env|ya?ml|toml|lock|sh|ps1|cmd|bat|pem|key|crt|csr|conf|inc|dist|dockerfile|gz|tgz|zip|tar|rar|7z)$ {
        return 404;
    }
    location ~* ^/(?:node_modules|tests?|scripts|docs|conteudo|supabase|backend|scratch|\.github)(?:/|$) {
        return 404;
    }
    location ~* ^/(?:package(?:-lock)?\.json|server\.js|Dockerfile|nginx\.conf|vercel\.json|docker-compose\.[a-z.]+|CLAUDE\.md|README\.md)$ {
        return 404;
    }
    # Nunca listar directorias
    autoindex off;
    # Só métodos necessários (bloqueia TRACE, CONNECT, etc.)
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 405;
    }

    # --- Páginas de erro com a imagem do SIGE ---
    error_page 400 /400.html;
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 405 /400.html;
    error_page 429 /429.html;
    error_page 500 /500.html;
    error_page 502 503 504 /503.html;
    location ~ ^/(?:400|403|404|429|500|503)\.html$ {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }
    # A API responde sempre em JSON, mesmo quando o backend está em baixo
    location @api_indisponivel {
        default_type application/json;
        return 503 '{"success":false,"message":"Serviço temporariamente indisponível. Tente novamente dentro de instantes."}';
    }

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Se o cliente aceder via IP bruto, redireciona 301 para o domínio oficial seguro HTTPS (sem expor IP)
    if ($host ~* ^\d+\.\d+\.\d+\.\d+$) {
        return 301 https://sigesaas.duckdns.org$request_uri;
    }

    # Cabeçalhos de Segurança HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https://api.qrserver.com https://*.openstreetmap.org; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' blob: data: https://www.openstreetmap.org https://drive.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # NOTA: o Nginx ignora os add_header do servidor num location que defina os seus proprios.
    # Por isso os locations abaixo com add_header repetem os cabecalhos de seguranca.

    #Otimização Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy reverso para o Backend Django REST Framework no Docker
    # Início de sessão: 10 tentativas/min por IP (força bruta); o Django aplica ainda o seu próprio limite
    location ~ ^/api/v1/auth/(login|token) {
        limit_req zone=sige_login burst=5 nodelay;
        error_page 502 503 504 = @api_indisponivel;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/ {
        limit_req zone=sige_api burst=60 nodelay;
        error_page 502 503 504 = @api_indisponivel;
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_temp_file_write_size 256k;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;  # gerar muitas cópias (conversão do Word) demora minutos
    }

    # Proxy reverso para Ferramentas do Sistema (Prompt Gateway SMS & Pagamentos)
    location ^~ /ferramentas/ {
        proxy_pass http://backend:8000/ferramentas/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Página pública de instruções para IA (aberta pelo QR Code das provas codificadas)
    location ^~ /ia/ {
        proxy_pass http://backend:8000/ia/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /health/ {
        proxy_pass http://backend:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Comprovativos de pagamento: nunca públicos. Só pela rota autenticada /api/v1/saas/pagamentos/<id>/comprovativo/.
    location ^~ /media/comprovativos/ {
        return 404;
    }

    location ^~ /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Site público: "/" é a página inicial (index.html); contacto, privacidade e termos são ficheiros estáticos.
    # Rotas limpas por perfil (sem #): cada ecrã tem o seu documento.
    #   /login                  -> login.html   (apenas o início de sessão)
    #   /<perfil>/<página>      -> painel.html  (cabeçalho, menu lateral e rodapé partilhados; a página
    #                              carrega-se de /pages/painel-*/ e o JS de /js/modules/painel-*/)
    # O rewrite volta a processar o pedido para .html, que aplica os cabeçalhos de segurança e no-cache.
    location = / {
        rewrite ^ /index.html last;
    }
    location = /login {
        rewrite ^ /login.html last;
    }
    location ~ "^/(saas|admin|direcao|pedagogico|secretaria|professor|aluno|encarregado|financeiro)(/[a-z0-9-]+)?/?$" {
        rewrite ^ /painel.html last;
    }

    # Qualquer outro caminho: ficheiro estático ou, na falta, a página 404 do SIGE (sem fallback silencioso para a entrada)
    location / {
        try_files $uri =404;
    }

    # Desativa cache para HTML, JS e CSS para refletir atualizações imediatamente
    location ~* \.(?:html|js|css|json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(self), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob: https://api.qrserver.com https://*.openstreetmap.org; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; frame-src 'self' blob: data: https://www.openstreetmap.org https://drive.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    # Cache leve apenas para imagens e fontes
    location ~* \.(?:ico|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}

# ==============================================================================
# SIGE — NGINX (Ocultação Rigorosa de IP e Forçamento do Domínio Oficial HTTPS)
# ==============================================================================

# 1. Servidor HTTP (Porta 80): Redireciona tudo para HTTPS no domínio oficial sigesaas.duckdns.org
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Desafios ACME Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
    }

    # Health check local interno para o Docker
    location = /health/ {
        proxy_pass http://backend:8000/health/;
        proxy_set_header Host localhost;
    }

    # Redirecionamento incondicional de qualquer acesso HTTP ou por IP direto para o domínio oficial HTTPS
    # Redirecionamento seguro de qualquer acesso HTTP para HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor HTTPS (Porta 443 — SSL/TLS Oficial Let's Encrypt)
server {
    listen 443 ssl default_server;
    http2 on;
    server_name sigesaas.duckdns.org sigesass.duckdns.org sige.8b54e22e.sslip.io sige.139-84-226-46.sslip.io _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100M;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Se o cliente aceder via IP bruto, redireciona 301 para o domínio oficial seguro HTTPS (sem expor IP)
    if ($host ~* ^\d+\.\d+\.\d+\.\d+$) {
        return 301 https://sigesaas.duckdns.org$request_uri;
    }

    # Cabeçalhos de Segurança HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Otimização Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy reverso para o Backend Django REST Framework no Docker
    location ^~ /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Proxy reverso para Ferramentas do Sistema (Prompt Gateway SMS & Pagamentos)
    location ^~ /ferramentas/ {
        proxy_pass http://backend:8000/ferramentas/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /health/ {
        proxy_pass http://backend:8000/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        proxy_pass http://backend:8000/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Fallback para SPA (evita 404 ao atualizar rotas client-side)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desativa cache para HTML, JS e CSS para refletir atualizações imediatamente
    location ~* \.(?:html|js|css|json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Cache leve apenas para imagens e fontes
    location ~* \.(?:ico|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }
}

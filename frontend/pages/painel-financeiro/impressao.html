<!-- SIGE - PAINEL-FINANCEIRO | Central de Recibos & Impressão -->
<!-- Página independente do módulo: impressao.html -->
<!-- Isolamento estrito de nível: Acesso restrito a este painel -->
<!-- ===================================================================== -->
      <section id="view-impressao" class="modulo-view" style="display: none;">
        <div class="card p-4 no-print mb-4">
          <h5 class="fw-bold mb-2"><i class="bi bi-printer me-2"></i>Central de Impressão de Documentos Oficiais</h5>
          <p class="text-muted small mb-3">Emita Boletins, Declarações, Certificados, Recibos e Fichas com formato oficial A4. Seleccione a modalidade individual ou emissão em lote por Turma.</p>
          
          <div class="row g-3 align-items-end">
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Tipo de Documento</label>
              <select id="printTipoDoc" class="form-select" onchange="alternarCamposImpressao(this.value)">
                <option value="BOLETIM">Boletim Escolar</option>
                <option value="DECLARACAO">Declaração Escolar com Notas</option>
                <option value="CERTIFICADO">Certificado de Habilitações</option>
                <option value="RECIBO">Recibo de Propina</option>
                <option value="FICHA">Ficha Biográfica do Aluno</option>
                <option value="PAUTA_TURMA">Pauta Geral da Turma</option>
                <option value="ACTA_CONSELHO">Acta do Conselho de Avaliação</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Turma</label>
              <select id="printSelectTurma" class="form-select" onchange="aoSelecionarTurmaImpressao()">
                <option value="">Selecione uma turma...</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Destinatário (Todos / Individual)</label>
              <select id="printSelectAluno" class="form-select">
                <option value="TODOS">-- Todos os Alunos (Lote) --</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label small fw-semibold">Orientação da Página</label>
              <select id="printOrientacaoSelect" class="form-select" onchange="atualizarOrientacaoDocumentoCentral(this.value)">
                <option value="auto" selected>Automática (Pauta: Horizontal | Outros: Vertical)</option>
                <option value="portrait">Vertical (Retrato / Portrait)</option>
                <option value="landscape">Horizontal (Paisagem / Landscape)</option>
              </select>
            </div>
            <div class="col-12 d-flex flex-wrap gap-2 justify-content-between align-items-center pt-2 border-top">
              <div class="d-flex align-items-center gap-2">
                <span class="small text-muted fw-semibold me-1">Orientação Rápida:</span>
                <div class="btn-group btn-group-sm" role="group" aria-label="Orientação">
                  <button type="button" class="btn btn-primary" id="btnOrientacaoAuto" onclick="definirOrientacaoDocumentoCentral('auto')" title="Automática: Pauta Horizontal, Restantes Vertical">
                    <i class="bi bi-magic me-1"></i> Auto
                  </button>
                  <button type="button" class="btn btn-outline-secondary" id="btnOrientacaoPortrait" onclick="definirOrientacaoDocumentoCentral('portrait')" title="Forçar Orientação Vertical">
                    <i class="bi bi-file-earmark me-1"></i> Vertical
                  </button>
                  <button type="button" class="btn btn-outline-secondary" id="btnOrientacaoLandscape" onclick="definirOrientacaoDocumentoCentral('landscape')" title="Forçar Orientação Horizontal">
                    <i class="bi bi-file-earmark-landscape me-1"></i> Horizontal
                  </button>
                </div>
              </div>
              <div class="d-flex flex-wrap gap-2 justify-content-end">
                <button class="btn btn-outline-primary btn-sm" onclick="carregarVisualizacaoImpressao()"><i class="bi bi-eye me-1"></i> Visualizar</button>
                <button class="btn btn-primary btn-sm" onclick="imprimirDocumentoCentral()"><i class="bi bi-printer me-1"></i> Imprimir</button>
                <button class="btn btn-outline-danger btn-sm" onclick="descarregarPdfCentral()"><i class="bi bi-file-earmark-pdf me-1"></i> PDF (.pdf)</button>
                <button class="btn btn-outline-primary btn-sm" onclick="descarregarDocxCentral()"><i class="bi bi-file-earmark-word me-1"></i> Word (.docx)</button>
                <button class="btn btn-outline-success btn-sm" onclick="descarregarXlsxCentral()"><i class="bi bi-file-earmark-excel me-1"></i> Excel (.xlsx)</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Área de Impressão Renderizada Oficial -->
        <div id="printAreaPreview" class="printable-document card p-5 bg-white mx-auto shadow-sm" style="max-width: 860px; display: none;">
          <!-- Conteúdo dinâmico oficial renderizado via JavaScript -->
        </div>
      </section>

<!-- SIGE - PAINEL-SUPERADMIN | Auditoria de Acessos SaaS -->
<!-- Página independente do módulo: acessos.html -->
<!-- Isolamento estrito de nível: Acesso restrito a este painel -->
<!-- ===================================================================== -->
      <section id="view-acessos" class="modulo-view" style="display: none;">
        <div class="card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h5 class="fw-bold mb-0"><i class="bi bi-shield-check me-2"></i>Auditoria de Acessos e Logs de Segurança</h5>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-danger btn-sm" onclick="exportarAcessosPdf()" title="Exportar a página actual em PDF">
                <i class="bi bi-file-earmark-pdf me-1"></i> PDF
              </button>
              <button class="btn btn-outline-success btn-sm" onclick="exportarAcessosExcel()" title="Exportar a página actual em Excel">
                <i class="bi bi-file-earmark-excel me-1"></i> Excel
              </button>
            </div>
          </div>
          <!-- Filtros em cascata: Escola → Tipo de evento → Pesquisa (altura constante para n registos) -->
          <div class="row g-2 mb-3">
            <div class="col-12 col-md-4">
              <select id="acessosFiltroEscola" class="form-select form-select-sm" onchange="aplicarFiltroLogsAcesso()" aria-label="Escola"><option value="">Todas as escolas</option></select>
            </div>
            <div class="col-6 col-md-3">
              <select id="acessosFiltroTipo" class="form-select form-select-sm" onchange="aplicarFiltroLogsAcesso()" aria-label="Tipo de evento">
                <option value="">Todos os eventos</option>
                <option value="LOGIN_SUCESSO">Login com sucesso</option>
                <option value="LOGIN_FALHA">Login falhado</option>
                <option value="ACESSO_BLOQUEADO_EXPIRADO">Acesso bloqueado (expirado)</option>
              </select>
            </div>
            <div class="col-6 col-md-5">
              <input type="search" id="acessosFiltroBusca" class="form-control form-control-sm" placeholder="Pesquisar utilizador, e-mail ou código..." oninput="aplicarFiltroLogsAcesso(true)" aria-label="Pesquisar utilizador">
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Data/Hora</th>
                  <th>Utilizador</th>
                  <th>Escola</th>
                  <th>Endereço IP</th>
                  <th>Navegador / Dispositivo</th>
                  <th>Evento de Segurança</th>
                </tr>
              </thead>
              <tbody id="tabelaLogsAcesso">
                <tr><td colspan="6" class="text-center py-4">A carregar logs...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-2">
            <small class="text-muted" id="acessosPaginacaoInfo"></small>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-secondary" id="acessosPagAnterior" onclick="mudarPaginaLogsAcesso(-1)">&laquo; Anterior</button>
              <button class="btn btn-outline-secondary" id="acessosPagSeguinte" onclick="mudarPaginaLogsAcesso(1)">Seguinte &raquo;</button>
            </div>
          </div>
        </div>
      </section>

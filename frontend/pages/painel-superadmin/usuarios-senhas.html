<!-- SIGE - PAINEL-SUPERADMIN | Cofre de Credenciais Master -->
<!-- Página independente do módulo: usuarios-senhas.html -->
<!-- Isolamento estrito de nível: Acesso restrito a este painel -->
<!-- ===================================================================== -->
      <section id="view-usuarios-senhas" class="modulo-view" style="display: none;">
        <div class="card p-4">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3 border-bottom pb-3">
            <div>
              <h5 class="fw-bold mb-0 text-warning text-dark"><i class="bi bi-shield-lock-fill text-warning me-2"></i>Cofre Restrito de Utilizadores e Palavras-passe</h5>
              <small class="text-muted">Visão global de todas as escolas: filtre por Escola → Perfil → pesquisa. Os resultados são paginados.</small>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <select id="filtroEscolaCofre" class="form-select form-select-sm" onchange="filtrarUsuariosCofre()" style="width: 220px;" aria-label="Escola"><option value="">Todas as escolas</option></select>
              <input type="search" id="filtroUsuarioCofre" class="form-control form-control-sm" placeholder="Pesquisar por código, nome ou e-mail..." oninput="filtrarUsuariosCofre(true)" style="width: 260px;">
              <select id="filtroRoleCofre" class="form-select form-select-sm" onchange="filtrarUsuariosCofre()" style="width: 190px;" aria-label="Perfil">
                <option value="">Todos os Perfis</option>
                <option value="SUPERADMIN">SuperAdmin</option>
                <option value="ADMIN_ESCOLA">Gabinete do Director (GD)</option>
                <option value="DIRECTOR_ESCOLA">Director da Escola (GD)</option>
                <option value="DAP">Direcção Pedagógica (DP)</option>
                <option value="CHEFE_SECRETARIA">Chefe da Secretaria</option>
                <option value="SECRETARIA">Secretaria (SECR)</option>
                <option value="FINANCEIRO">Financeiro</option>
                <option value="PROFESSOR">Professores (PR)</option>
                <option value="ALUNO">Alunos</option>
                <option value="ENCARREGADO">Encarregados</option>
              </select>
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-danger btn-sm" onclick="exportarUsuariosPdf()" title="Exportar utilizadores em PDF">
                  <i class="bi bi-file-earmark-pdf me-1"></i> PDF
                </button>
                <button class="btn btn-outline-success btn-sm" onclick="exportarUsuariosExcel()" title="Exportar utilizadores em Excel">
                  <i class="bi bi-file-earmark-excel me-1"></i> Excel
                </button>
              </div>
              <button class="btn btn-primary btn-sm" onclick="carregarCofreUsuarios()">
                <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
              </button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Código de Acesso</th>
                  <th>Nome Completo</th>
                  <th>Escola</th>
                  <th>E-mail de Acesso</th>
                  <th>Perfil / Órgão</th>
                  <th>Telefone</th>
                  <th>Último Acesso</th>
                  <th>Estado</th>
                  <th class="text-end">Acções</th>
                </tr>
              </thead>
              <tbody id="tabelaCofreUsuariosCorpo">
                <tr><td colspan="9" class="text-center py-4">A carregar utilizadores...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mt-2">
            <small class="text-muted" id="cofrePaginacaoInfo"></small>
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-secondary" id="cofrePagAnterior" onclick="mudarPaginaCofre(-1)">&laquo; Anterior</button>
              <button class="btn btn-outline-secondary" id="cofrePagSeguinte" onclick="mudarPaginaCofre(1)">Seguinte &raquo;</button>
            </div>
          </div>
        </div>
      </section>

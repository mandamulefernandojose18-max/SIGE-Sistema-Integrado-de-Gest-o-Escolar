<!-- ===================================================================== -->
<!-- SIGE - PAINEL-ALUNO | As Minhas Propinas & Mensalidades -->
<!-- Página independente do módulo: aluno-pagamentos.html -->
<!-- Isolamento estrito de nível: Acesso restrito a este painel -->
<!-- ===================================================================== -->
      <section id="view-aluno-pagamentos" class="modulo-view" style="display: none;">
  <!-- Barra Superior: Apenas o Seletor de Ano Lectivo com Buscar (Exatamente como em Exames) -->
  <div class="card p-3 mb-4 no-print border-0 shadow-sm bg-light">
    <div class="d-flex align-items-center">
      <div class="sige-seletor-ano-box d-flex align-items-center">
        <select id="alunoPagamentosAnoSelect" class="form-select form-select-sm sige-select-ano-lectivo">
          <option value="" selected>-- Escolha ano Lectivo --</option>
        </select>
        <button type="button" class="btn btn-sm btn-sige-buscar-ano" onclick="aoClicarBuscarAnoMestreView('aluno-pagamentos')">
          Buscar <i class="bi bi-search ms-1"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Conteúdo Completo: Ocultado inicialmente até escolher o ano e clicar em Buscar -->
  <div id="alunoPagamentosConteudoDinamico" class="sige-conteudo-modulo-dinamico d-none">

        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="stat-card">
              <div>
                <span class="text-muted small text-uppercase fw-semibold">Total Liquidado</span>
                <h4 id="alunoTotalPagoCard" class="fw-bold mb-0 text-success">0 <span class="moeda-sufixo">MZN</span></h4>
              </div>
              <div class="stat-icon bg-success bg-opacity-10 text-success"><i class="bi bi-check-circle-fill"></i></div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-card">
              <div>
                <span class="text-muted small text-uppercase fw-semibold">Propinas Pendentes</span>
                <h4 id="alunoTotalPendenteCard" class="fw-bold mb-0 text-warning">0 <span class="moeda-sufixo">MZN</span></h4>
              </div>
              <div class="stat-icon bg-warning bg-opacity-10 text-warning"><i class="bi bi-clock-history"></i></div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="stat-card">
              <div>
                <span class="text-muted small text-uppercase fw-semibold">Situação das Propinas</span>
                <h4 id="alunoSituacaoPropinaCard" class="fw-bold mb-0 text-primary">Regular</h4>
              </div>
              <div class="stat-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-wallet2"></i></div>
            </div>
          </div>
        </div>

        <div class="card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h5 class="fw-bold mb-0"><i class="bi bi-cash-stack text-success me-2"></i>As Minhas Mensalidades & Propinas</h5>
              <small class="text-muted">Consulte os pagamentos efectuados e descarregue os seus recibos oficiais em PDF.</small>
            </div>
            <div class="d-flex gap-2 align-items-center">
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-danger btn-sm" onclick="exportarExtratoAlunoPdf()" title="Descarregar extrato em PDF">
                  <i class="bi bi-file-earmark-pdf me-1"></i> PDF
                </button>
                <button class="btn btn-outline-success btn-sm" onclick="exportarExtratoAlunoExcel()" title="Descarregar extrato em Excel">
                  <i class="bi bi-file-earmark-excel me-1"></i> Excel
                </button>
              </div>
              <button class="btn btn-outline-primary btn-sm" onclick="carregarAlunoPagamentos()">
                <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
              </button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Descrição</th>
                  <th>Mês Ref.</th>
                  <th>Valor (MZN)</th>
                  <th>Vencimento</th>
                  <th>Estado</th>
                  <th class="text-end">Recibo</th>
                </tr>
              </thead>
              <tbody id="tabelaAlunoPagamentosCorpo">
                <tr><td colspan="6" class="text-center py-4">A carregar pagamentos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      
  </div>
</section>

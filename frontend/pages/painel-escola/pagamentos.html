<!-- SIGE - PAINEL-ESCOLA | Mensalidades & Propinas -->
<!-- Página independente do módulo: pagamentos.html -->
<!-- Isolamento estrito de nível: Acesso restrito a este painel -->
<!-- ===================================================================== -->
      <section id="view-pagamentos" class="modulo-view" style="display: none;">
        <div class="row g-3 mb-4">
          <div class="col-md-3">
            <div class="stat-card">
              <div>
                <span class="text-muted small text-uppercase fw-semibold">Faturamento Total</span>
                <h4 id="finFaturadoCard" class="fw-bold mb-0 text-success">0 <span class="moeda-sufixo">MZN</span></h4>
              </div>
              <div class="stat-icon bg-success bg-opacity-10 text-success"><i class="bi bi-cash-stack"></i></div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="stat-card">
              <div>
                <span class="text-muted small text-uppercase fw-semibold">Em Atraso</span>
                <h4 id="finAtrasadoCard" class="fw-bold mb-0 text-danger">0 <span class="moeda-sufixo">MZN</span></h4>
              </div>
              <div class="stat-icon bg-danger bg-opacity-10 text-danger"><i class="bi bi-exclamation-circle-fill"></i></div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="stat-card">
              <div>
                <span class="text-muted small text-uppercase fw-semibold">Inadimplência</span>
                <h4 id="finInadimplenciaCard" class="fw-bold mb-0 text-warning">0%</h4>
              </div>
              <div class="stat-icon bg-warning bg-opacity-10 text-warning"><i class="bi bi-pie-chart-fill"></i></div>
            </div>
          </div>
          <div class="col-md-3">
            <div class="stat-card">
              <div>
                <span class="text-muted small text-uppercase fw-semibold">Alunos em Dia</span>
                <h4 id="finAdimplentesCard" class="fw-bold mb-0 text-primary">0%</h4>
              </div>
              <div class="stat-icon bg-primary bg-opacity-10 text-primary"><i class="bi bi-check-circle"></i></div>
            </div>
          </div>
        </div>

        <div class="card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="bi bi-wallet2 me-2"></i>Gestão de Propinas & Mensalidades (MZN)</h5>
            <div class="d-flex gap-2 align-items-center flex-wrap">
              <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-danger btn-sm" onclick="exportarPagamentosPdf()" title="Exportar pagamentos em PDF">
                  <i class="bi bi-file-earmark-pdf me-1"></i> PDF
                </button>
                <button class="btn btn-outline-success btn-sm" onclick="exportarPagamentosExcel()" title="Exportar pagamentos em Excel">
                  <i class="bi bi-file-earmark-excel me-1"></i> Excel
                </button>
                <button class="btn btn-outline-primary btn-sm" onclick="exportarPagamentosWord()" title="Exportar pagamentos em Word">
                  <i class="bi bi-file-earmark-word me-1"></i> Word
                </button>
              </div>
              <button class="btn btn-outline-primary btn-sm" onclick="modalGerarMensalidadesTurma()"><i class="bi bi-calendar-plus me-1"></i> Gerar em Lote para Turma</button>
              <button class="btn btn-primary btn-sm" onclick="modalNovoPagamento()"><i class="bi bi-plus-lg me-1"></i> Nova Cobrança</button>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Aluno</th>
                  <th>Descrição</th>
                  <th>Mês Ref.</th>
                  <th>Valor (MZN)</th>
                  <th>Vencimento</th>
                  <th>Estado</th>
                  <th class="text-end">Liquidação & Recibo</th>
                </tr>
              </thead>
              <tbody id="tabelaPagamentos">
                <tr><td colspan="7" class="text-center py-4">A carregar pagamentos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

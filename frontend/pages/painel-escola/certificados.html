<!-- SIGE - PAINEL-ESCOLA | Certificados Oficiais com QR Code -->
<!-- Página independente do módulo: certificados.html -->
<!-- Isolamento estrito de nível: Acesso restrito a este painel -->
<!-- ===================================================================== -->
      <section id="view-certificados" class="modulo-view" style="display: none;">
  <!-- Barra Superior: Apenas o Seletor de Ano Lectivo com Buscar (Exatamente como em Exames) -->
  <div class="card p-3 mb-4 no-print border-0 shadow-sm bg-light">
    <div class="d-flex align-items-center">
      <div class="sige-seletor-ano-box d-flex align-items-center">
        <select id="certificadosAnoSelect" class="form-select form-select-sm sige-select-ano-lectivo">
          <option value="" selected>-- Escolha ano Lectivo --</option>
        </select>
        <button type="button" class="btn btn-sm btn-sige-buscar-ano" onclick="aoClicarBuscarAnoMestreView('certificados')">
          Buscar <i class="bi bi-search ms-1"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Conteúdo Completo: Ocultado inicialmente até escolher o ano e clicar em Buscar -->
  <div id="certificadosConteudoDinamico" class="sige-conteudo-modulo-dinamico d-none">

        <div class="card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0"><i class="bi bi-award me-2"></i>Emissão de Certificados com Autenticação Digital QR Code</h5>
            <button class="btn btn-primary btn-sm" onclick="modalEmitirCertificado()"><i class="bi bi-patch-check me-1"></i> Emitir Novo Certificado</button>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-light">
                <tr>
                  <th>Código de Autenticidade</th>
                  <th>Aluno</th>
                  <th>Tipo de Certificado</th>
                  <th>Data de Emissão</th>
                  <th>QR Code</th>
                  <th class="text-end">Validação Pública</th>
                </tr>
              </thead>
              <tbody id="tabelaCertificados">
                <tr><td colspan="6" class="text-center py-4">A carregar certificados...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      
  </div>
</section>

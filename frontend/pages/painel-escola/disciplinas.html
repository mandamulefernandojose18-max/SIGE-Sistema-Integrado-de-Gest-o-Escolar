<!-- ===================================================================== -->
<!-- SIGE - PAINEL-ESCOLA | Disciplinas & Currículo -->
<!-- Página independente do módulo: disciplinas.html -->
<!-- Isolamento estrito de nível: Acesso restrito a este painel -->
<!-- ===================================================================== -->
<section id="view-disciplinas" class="modulo-view" style="display: none;">
  <!-- Barra Superior: Apenas o Seletor de Ano Lectivo com Buscar (Exatamente como em Exames) -->
  <div class="card p-3 mb-4 no-print border-0 shadow-sm bg-light">
    <div class="d-flex align-items-center">
      <div class="sige-seletor-ano-box d-flex align-items-center">
        <select id="disciplinasAnoSelect" class="form-select form-select-sm sige-select-ano-lectivo">
          <option value="" selected>-- Escolha ano Lectivo --</option>
        </select>
        <button type="button" class="btn btn-sm btn-sige-buscar-ano" onclick="aoClicarBuscarAnoMestreView('disciplinas')">
          Buscar <i class="bi bi-search ms-1"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Conteúdo Completo: Ocultado inicialmente até escolher o ano e clicar em Buscar -->
  <div id="disciplinasConteudoDinamico" class="sige-conteudo-modulo-dinamico d-none">

  <div class="row g-4 mb-4">
    <div class="col-lg-12">
      <div class="card p-4">
        <!-- 1. Cabeçalho Principal da Página -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
          <div>
            <h5 class="fw-bold mb-1 text-primary">
              <i class="bi bi-book-half me-2"></i>Disciplinas
            </h5>
            <p class="text-muted small mb-0">
              Plano curricular da instituição. Navegue pelas <strong>páginas das Classes</strong> abaixo para gerir as disciplinas e definir os critérios de exame por <strong>Área / Secção</strong>.
            </p>
          </div>
          
          <div class="d-flex flex-wrap align-items-center gap-2">
            <!-- Seletor do Modelo da Instituição: Classes vs Níveis -->
            <div class="p-1 bg-light rounded border d-flex align-items-center">
              <span class="small fw-semibold text-secondary me-2 ms-2 d-none d-sm-inline">
                <i class="bi bi-gear-wide-connected me-1"></i>Regime:
              </span>
              <div class="btn-group btn-group-sm" role="group" aria-label="Regime Curricular">
                <button type="button" class="btn btn-sm" id="btnRegimeClasses" onclick="selecionarRegimeInstituicao('CLASSES')" title="Ensino Geral: 1ª à 12ª Classe">
                  <i class="bi bi-mortarboard me-1"></i>Classes (1ª à 12ª)
                </button>
                <button type="button" class="btn btn-sm" id="btnRegimeNiveis" onclick="selecionarRegimeInstituicao('NIVEIS')" title="Técnico-Profissional: Nível 1, Nível 2...">
                  <i class="bi bi-layers me-1"></i>Níveis (Nível 1, 2...)
                </button>
              </div>
            </div>

            <!-- Botão Nova Disciplina Geral -->
            <button class="btn btn-primary btn-sm fw-semibold shadow-sm" onclick="modalNovaDisciplina()">
              <i class="bi bi-plus-lg me-1"></i> Nova Disciplina
            </button>
          </div>
        </div>

        <!-- 2. Navegador de Sub-páginas das Classes (Abas de Classes da Escola) -->
        <div class="p-2 bg-light rounded border mb-3">
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <!-- Abas/Páginas das Classes da Instituição -->
            <div class="d-flex flex-wrap align-items-center gap-1" id="navAbasClassesInstituicao">
              <span class="small fw-bold text-uppercase text-secondary me-2">
                <i class="bi bi-mortarboard text-primary me-1"></i><span id="labelNavClasses">Classes:</span>
              </span>
              <!-- Abas geradas dinamicamente: [ 10ª Classe ] [ 11ª Classe ] ... -->
            </div>

            <!-- Botão Dropdown para Adicionar Nova Classe/Nível Oficial -->
            <div class="dropdown">
              <button class="btn btn-sm btn-success fw-bold dropdown-toggle shadow-sm" type="button" id="dropdownBtnAdicionarClasse" data-bs-toggle="dropdown" aria-expanded="false" title="Adicionar uma nova classe ou nível oficial da lista">
                <i class="bi bi-plus-circle me-1"></i><span id="textoBtnAdicionarClasse">+ Adicionar Classe</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end shadow" id="listaDropdownClassesDisponiveis" aria-labelledby="dropdownBtnAdicionarClasse" style="max-height: 280px; overflow-y: auto;">
                <!-- Preenchido via JS com a lista oficial estrita -->
              </ul>
            </div>
          </div>
        </div>

        <!-- 3. Container Dinâmico da Sub-Página da Classe Ativa -->
        <div id="containerSubpaginaClasse">
          <!-- Renderizado dinamicamente por renderizarSubpaginaClasseAtiva() -->
          <div class="text-center py-5 text-muted">
            <div class="spinner-border text-primary spinner-border-sm me-2" role="status"></div>
            A carregar plano curricular e disciplinas...
          </div>
        </div>

      </div>
    </div>
  </div>

  </div>
</section>

      <section id="view-professor-perfil" class="modulo-view" style="display: none;">
        <div class="card p-4 mb-4">
          <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3 border-bottom pb-3">
            <div>
              <h5 class="fw-bold mb-0 text-primary"><i class="bi bi-person-badge-fill me-2"></i>Perfil Individual do Docente</h5>
              <small class="text-muted">Consulte os seus dados cadastrais, turmas, disciplinas lecionadas e altere a sua palavra-passe</small>
            </div>
            <div class="d-flex gap-2">
              <button class="btn btn-primary btn-sm fw-semibold" onclick="modalRedefinirMinhaSenha()">
                <i class="bi bi-key-fill me-1"></i> Alterar a Minha Senha
              </button>
              <button class="btn btn-outline-primary btn-sm" onclick="carregarPerfilDocenteIndividual()">
                <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
              </button>
            </div>
          </div>

          <div class="row g-4" id="perfilDocenteConteudo">
            <div class="col-12 text-center py-4">
              <div class="spinner-border text-primary"></div>
              <p class="small text-muted mt-2">A carregar o seu perfil...</p>
            </div>
          </div>
        </div>
      </section>

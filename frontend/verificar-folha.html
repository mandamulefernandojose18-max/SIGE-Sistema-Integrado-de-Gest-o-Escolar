<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificação de Folha de Resposta — SIGE</title>
  <script>
    if (window.location.hostname !== 'sigesaas.duckdns.org' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      window.location.replace('https://sigesaas.duckdns.org' + window.location.pathname + window.location.search);
    }
  </script>
  <link href="/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <style>
    body { background: #f1f5f9; font-family: "Times New Roman", Times, serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .cartao { max-width: 640px; width: 100%; border: none; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,.1); }
    .topo-ok { background: linear-gradient(135deg, #059669, #10b981); color: #fff; padding: 28px 20px; text-align: center; }
    .topo-erro { background: linear-gradient(135deg, #dc2626, #ef4444); color: #fff; padding: 28px 20px; text-align: center; }
    th { width: 38%; background: #f8fafc; }
  </style>
</head>
<body>
<main class="card cartao bg-white">
  <div id="topo" class="topo-ok">
    <i id="icone" class="bi bi-patch-check-fill display-3" aria-hidden="true"></i>
    <h1 id="titulo" class="h3 mt-2 fw-bold">Verificação de Folha de Resposta</h1>
    <p id="descricao" class="mb-0">A verificar…</p>
  </div>
  <div class="card-body p-4">
    <div id="carregando" class="text-center py-3"><div class="spinner-border text-success" role="status"></div></div>
    <div id="detalhes" class="d-none">
      <div class="table-responsive">
        <table class="table table-bordered table-sm mb-3"><tbody id="linhas"></tbody></table>
      </div>
      <p class="small text-muted mb-0">Por privacidade, esta página não mostra o nome do aluno. O documento foi emitido pelo SIGE — Sistema Integrado de Gestão Escolar.</p>
    </div>
    <p id="erro" class="d-none mb-0"></p>
  </div>
</main>
<script>
(function () {
  'use strict';
  function esc(t) { var d = document.createElement('div'); d.textContent = t == null ? '' : String(t); return d.innerHTML; }
  function falha(msg) {
    document.getElementById('topo').className = 'topo-erro';
    document.getElementById('icone').className = 'bi bi-x-octagon-fill display-3';
    document.getElementById('titulo').textContent = 'Folha não reconhecida';
    document.getElementById('descricao').textContent = 'Não foi possível confirmar esta folha.';
    document.getElementById('carregando').classList.add('d-none');
    var e = document.getElementById('erro'); e.textContent = msg; e.classList.remove('d-none');
  }
  var q = new URLSearchParams(window.location.search);
  var d = q.get('d'), s = q.get('s');
  if (!d || !s) { falha('Código em falta. Leia novamente o QR da folha.'); return; }
  fetch('/api/v1/documentos/folha-resposta/verificar/?d=' + encodeURIComponent(d) + '&s=' + encodeURIComponent(s))
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (x) {
      if (!x.ok || !x.j.valida) { falha(x.j.detail || 'Código inválido ou adulterado.'); return; }
      var j = x.j, a = j.aluno, linhas = [
        ['Escola', j.escola.nome + (j.escola.codigo ? ' (cód. ' + j.escola.codigo + ')' : '')],
        ['Avaliação', j.avaliacao],
        ['Disciplina', j.disciplina],
        ['Ano lectivo', j.ano_letivo],
        ['Versão', j.versao || '—'],
        ['Nº de perguntas', j.n_perguntas]
      ];
      if (j.folha_em_branco) linhas.push(['Folha', 'Em branco (sem aluno)']);
      else if (a) {
        linhas.push(['Aluno', 'Código ' + a.codigo_mascarado + (a.registado ? '' : ' (não encontrado no sistema)')]);
        if (a.classe) linhas.push(['Classe / Turma', a.classe + (a.turma ? ' · ' + a.turma : '')]);
      }
      document.getElementById('descricao').textContent = 'Folha de resposta autêntica, emitida pelo SIGE.';
      document.getElementById('titulo').textContent = 'Folha autêntica';
      document.getElementById('linhas').innerHTML = linhas.map(function (l) { return '<tr><th>' + esc(l[0]) + '</th><td>' + esc(l[1]) + '</td></tr>'; }).join('');
      document.getElementById('carregando').classList.add('d-none');
      document.getElementById('detalhes').classList.remove('d-none');
    })
    .catch(function () { falha('Sem ligação ao servidor. Tente novamente.'); });
})();
</script>
</body>
</html>
